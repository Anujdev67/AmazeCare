services:
  mysql:
    image: mysql:8.4
    container_name: amazecare-mysql
    environment:
      MYSQL_DATABASE: amazecare_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: amazecare-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/amazecare_db?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
