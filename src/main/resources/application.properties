spring.application.name=amazecare

# Database connection settings.
# Use environment variables in cloud/container deployments; the defaults
# keep local development simple when no environment values are provided.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amazecare_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate dialect for MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Runtime server port (overridable in cloud platforms).
server.port=${SERVER_PORT:8082}

# Schema handling strategy.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
